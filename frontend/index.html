    <style>
      /* SEO prerender block: crawlable in raw HTML, off-screen for sighted
         users (no flash), removed once JS boots. See scripts/seoPrerenderPlugin.js */
      /* This block is clipped to 1x1 and deleted the moment JS boots, but it IS
         rendered, so it used to pull webfonts purely to lay out text nobody can
         see: --font-body gave every route the 129KB Newsreader latin subset,
         and the h1/h2/h3 inside it matched `h1,h2,h3{font-family:var(--font-display)}`
         in styles.css for another 66KB of Fraunces. On /people and /products,
         which use neither family, that was ~195KB of pure waste. Whether the
         fetch actually fired was a race against JS removing the block, so the
         cost came and went between loads.
         The descendant selector is what kills the Fraunces half - (0,1,0) beats
         the bare `h1,h2,h3` element rule, so no !important is needed. */
      .seo-prerender,
      .seo-prerender * {
        font-family: system-ui, sans-serif;
      }

      .seo-prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
      }
    </style>

    <!-- Fonts are self-hosted (no external requests). Critical display faces are
         preloaded here; every other family/weight is declared via @font-face in
         src/fonts.css (General Sans, Geist Mono, Fraunces, Newsreader, Outfit)
         and src/scroll-hero.css (Heming, Chillax). Regenerate the vendored
         woff2 files + src/fonts.css with scripts/fetch-fonts.py. -->
    <link rel="preload" href="/fonts/Heming-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Chillax-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pretendard Variable, the /portal/catalog typeface. Subset 91 ONLY: it is
         the core-Latin slice (37KB) that every catalog page renders. Subsets 71
         and 79 are declared in src/catalog/catalog.css with unicode-range, so the
         browser fetches those two (59KB) only if a glyph actually needs them —
         preloading all three would cost 96KB for coverage no page uses. One file
         serves every weight: the variable axis is 45-920. -->
    <link rel="preload" href="/fonts/PretendardVariable.subset.91.woff2" as="font" type="font/woff2" crossorigin />
