; Scoped to scripts/catalog so `pytest scripts/catalog/tests` from the repo root does
; not pick up backend/pytest.ini (asyncio_mode = auto, testpaths = tests) — these tests
; are synchronous and have no database.
;
; `pythonpath = .` is resolved against this file's directory, which is what puts
; `ingest/` on sys.path for `from ingest.imu import ...`.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q
